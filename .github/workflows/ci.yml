name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # A venv pinned to the matrix version, put on PATH. Deliberately not
      # `uv run`: without a lockfile that re-resolves the project across every
      # interpreter `requires-python` allows, which fails on a dependency that
      # has nothing to do with the version under test. `uv pip --system` is
      # also out -- the Linux runner's interpreter is externally managed, and
      # it would silently ignore the matrix version.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"
          if [ -d .venv/Scripts ]; then echo "$PWD/.venv/Scripts" >> "$GITHUB_PATH"
          else echo "$PWD/.venv/bin" >> "$GITHUB_PATH"; fi

      # A matrix that silently tests one version twice reports coverage it
      # does not have. This is the guard against that.
      - name: Confirm the interpreter is the one the matrix asked for
        run: |
          python -c "import sys; v='${{ matrix.python-version }}'; assert sys.version.startswith(v), f'wanted {v}, got {sys.version}'; print(sys.version)"

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy

      # The whole suite runs against the mock provider: no credentials, no
      # network, no cost. That is a deliberate property of the architecture --
      # a company of a hundred agents has to be free to test.
      - name: Test
        run: pytest -q

      # The playbook regression gate (ADR-0005). A revision of the company's
      # critique procedure that catches fewer real defects on the scenario
      # suite fails here and does not ship. Offline, deterministic and free --
      # the worlds are generated, so this never waits on a market.
      - name: Playbook regression
        run: |
          aurelis training regression
          # And the gate must actually bite. A blunted survivorship check
          # misses defects that are really there, so this must exit non-zero;
          # a gate that passed everything would be worse than no gate.
          if aurelis training regression --defect survivorship --degradation 5; then
            echo "the regression gate accepted a procedure that finds less" >&2
            exit 1
          fi

      - name: End-to-end acceptance
        run: |
          workspace="${RUNNER_TEMP}/aurelis-ci"
          mkdir -p "$workspace"
          aurelis db init -w "$workspace"
          aurelis doctor -w "$workspace"
          aurelis demo -w "$workspace"
          # Staffing routes through onboarding: every hire is scored on the
          # scenario suite before it may work, and the roster prints what each
          # one started with.
          aurelis agent hire -w "$workspace"
          aurelis training roster -w "$workspace"
          # The company reorganises itself twice, against predictions hashed
          # before the Board saw them. The first one fails; the record says so.
          aurelis orgdev develop -w "$workspace"
          aurelis orgdev changes -w "$workspace"
          aurelis orgdev metrics -w "$workspace"
          # All seven desks: opened through the checklist, one complete mission
          # each, and the results put side by side through their own calendars.
          aurelis desk list
          aurelis desk calendars
          aurelis desk power
          aurelis desk compare -w "$workspace" --span 0.05
          # An agent in the critic's seat, weighed by the same gate as the
          # procedure it would replace.
          aurelis training seat -w "$workspace"
          # An agent in the author's seat: it writes a rule in the company's
          # rule language, the rule is preregistered as one cell, and the
          # result is reported whatever it is. On the fixture it loses to
          # buy-and-hold.
          aurelis strategy author -w "$workspace"
          # And the loop with its stopping rule: a budget of rules frozen
          # before the first is written, then the best result corrected for
          # the width of the search and the estimator's own noise. It beats
          # buy-and-hold and still does not survive.
          aurelis strategy campaign -w "$workspace" --budget 3
          # What stands between an authored version and a paper book, read
          # from the record: seven gates, each a number or a silence naming
          # what is absent. Several are silent here -- capacity is a claim
          # about traded volume and there is no recorded market; the deflated
          # Sharpe needs martex-quant, which is an optional wheel this job
          # does not install. A silent gate cannot be passed, so the
          # deployment is refused and nothing is written.
          aurelis trading readiness -w "$workspace"
          aurelis trading deploy -w "$workspace"
          # And the refusal must bite. Offline there is no recorded market and
          # nothing was deployed, so a walk that ran anyway would be trading a
          # rule the gates rejected, on bars nobody fetched.
          if aurelis trading paper -w "$workspace"; then
            echo "the paper walk ran with nothing deployed" >&2
            exit 1
          fi
          # Model routing. The tier every charter declares now picks a real
          # model; offline that is still the mock, and `model check` proves the
          # whole path end to end without credentials.
          aurelis model routes
          aurelis model tiers
          aurelis model check -w "$workspace"
          # Conformance: can a seat's answers actually be used? Offline this
          # runs the stand-in, which is exactly the baseline a real model gets
          # compared against -- and the first real model scored 0/5 where the
          # stand-in scores 5/5.
          aurelis model rehearse -w "$workspace" --seat author --samples 3
          aurelis model rehearse -w "$workspace" --seat critic --samples 3
          # The company staffs its seven desks on measured evidence, through
          # the same org-change lifecycle it uses for everything else.
          aurelis orgdev scale -w "$workspace"
          # The company splits the agent paying most for a model it did not
          # need -- proposed on a reading, hashed before the Board, measured
          # after. It improves by less than it moved, and says so.
          aurelis orgdev retier -w "$workspace"
          # The last word. The company checks itself against eleven conditions it
          # declared in advance and says not yet -- naming the two that no
          # amount of research could fix. A run where this said READY on
          # fixture data would be a bug in the standard.
          # A replication under a declared variation. Offline: the fixture is
          # the source, and the point is that the record gets written at all --
          # the table existed from M5 with nothing ever filling it.
          aurelis research replicate REG-0001 -w "$workspace" --variation seed
          aurelis data snapshots -w "$workspace"
          # The company decides its own next action. On a fresh workspace it
          # authors, searches once, holds a review that refutes a confirmed
          # claim, replicates, and stops -- naming a reason for everything it
          # gave up on. A run that kept searching would be the bug.
          aurelis run -w "$workspace" --cycles 12
          # And the stopping rule must bite: a second run must not start a
          # second campaign, because widening a declared search raises the bar
          # the best design has to clear faster than searching finds anything.
          count_campaigns() {
            python -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('SELECT count(*) FROM authoring_campaigns').fetchone()[0])" "$workspace/aurelis.db"
          }
          before=$(count_campaigns)
          aurelis run -w "$workspace" --cycles 12
          after=$(count_campaigns)
          if [ "$before" != "$after" ]; then
            echo "the loop ran a second campaign: $before -> $after" >&2
            exit 1
          fi
          # M25: the judgement seat. A recording is what a view is sealed
          # against; offline that is a desk fixture, marked as not a market.
          # Three agents pick a market and seal a view in advance; nothing is
          # due, so resolve reports every horizon still ahead; the calibration
          # report says nothing is scored rather than printing a number.
          aurelis data record-fixture -w "$workspace" --symbol BTC/USDT
          aurelis data record-fixture -w "$workspace" --symbol ETH/USDT
          aurelis thesis seat -w "$workspace" --agent INTEL --agent QUANT --agent STRAT
          aurelis thesis list -w "$workspace"
          aurelis thesis resolve -w "$workspace"
          aurelis thesis calibration -w "$workspace" --fixtures
          # The loop seats every judging agent on every recorded market, then
          # stops with the honest reason: a second view on the same instrument
          # before the first resolves is the same bet twice, and the loop
          # fetches nothing. The company was scaled above, so this takes many
          # cycles -- the bound is generous and the check is the stop reason
          # the loop itself prints, not a count somebody guessed.
          count_theses() {
            python -c "import sqlite3,sys; print(sqlite3.connect(sys.argv[1]).execute('SELECT count(*) FROM theses').fetchone()[0])" "$workspace/aurelis.db"
          }
          aurelis run -w "$workspace" --cycles 120 --calls 400 | tee "${RUNNER_TEMP}/run-judge.txt"
          if ! grep -q "sealed and waiting" "${RUNNER_TEMP}/run-judge.txt"; then
            echo "the judge action did not exhaust itself with its reason" >&2
            exit 1
          fi
          sealed=$(count_theses)
          if [ "$sealed" -le 3 ]; then
            echo "the loop seated nobody: $sealed view(s)" >&2
            exit 1
          fi
          aurelis run -w "$workspace" --cycles 20 --calls 60
          if [ "$(count_theses)" != "$sealed" ]; then
            echo "the loop placed the same bet twice: $sealed -> $(count_theses)" >&2
            exit 1
          fi
          # M27: the company runs unattended. A person records a grant once
          # (offline: a fixture, marked as not a market); one wake fetches
          # under it, settles what a recording covers, runs the loop inside a
          # daily model-call budget, and writes a row. The grant cannot be
          # widened, and the service cannot trade.
          aurelis service grant -w "$workspace" --source fixture:crypto --instrument BTC/USDT --reason "CI rehearsal of the service"
          aurelis service start -w "$workspace" --once --calls-per-day 60
          aurelis service status -w "$workspace"
          aurelis mandate standard
          aurelis mandate assess -w "$workspace"
          aurelis mandate history -w "$workspace"
          aurelis ledger verify -w "$workspace"
          # Chain verification and artifact digests, then a full backup/restore
          # round trip -- a restore that only reports "a file opened" has
          # checked nothing.
          aurelis db verify -w "$workspace"
          aurelis db backup "${RUNNER_TEMP}/aurelis-backup" -w "$workspace"
          aurelis db restore "${RUNNER_TEMP}/aurelis-backup"             -w "${RUNNER_TEMP}/aurelis-restored"
          aurelis ledger verify -w "${RUNNER_TEMP}/aurelis-restored"
