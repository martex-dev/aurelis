name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      # A uv-managed venv pinned to the matrix version. `uv pip --system`
      # cannot be used here: the Linux runner's interpreter is externally
      # managed, and it would also silently ignore the matrix version.
      - name: Install
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -e ".[dev]"

      - name: Confirm the interpreter is the one the matrix asked for
        run: uv run python -c "import sys; assert sys.version.startswith('${{ matrix.python-version }}'), sys.version; print(sys.version)"

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy

      # The whole suite runs against the mock provider: no credentials, no
      # network, no cost. That is a deliberate property of the architecture --
      # a company of a hundred agents has to be free to test.
      - name: Test
        run: uv run pytest -q

      - name: End-to-end acceptance
        shell: bash
        run: |
          workspace="${RUNNER_TEMP}/aurelis-ci"
          mkdir -p "$workspace"
          uv run aurelis db init -w "$workspace"
          uv run aurelis doctor -w "$workspace"
          uv run aurelis demo -w "$workspace"
          uv run aurelis ledger verify -w "$workspace"
